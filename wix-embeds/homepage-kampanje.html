<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kampanje / Events</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        /* Transparent so it blends with whatever the Wix section background is.
           NB: the Wix embed iframe has a FIXED height — content must flow from
           the top and stay compact on mobile, or everything below the fold is
           invisible (Carina 18.08: "teksten gjemmes bak bilder"). Vertical
           centering only on desktop, where the iframe is taller than content. */
        body { background: transparent; font-family: 'Poppins', Helvetica, Arial, sans-serif; color: #ffffff; padding: 10px; }
        @media (min-width: 761px) { body { min-height: 100vh; display: flex; align-items: center; } }
        #sections { max-width: 1600px; margin: 0 auto; width: 100%; padding: 0 16px; }

        /* Section banner heading — staff-editable via the top campaign's bannerTitle field */
        .banner-title { text-align: center; color: #E8813C; font-family: 'Sora','Poppins',sans-serif; font-weight: 800; font-size: clamp(1.9rem, 5vw, 4.4rem); line-height: 1.1; margin: 0 0 36px; letter-spacing: .01em; }
        /* Én linje på desktop (som i annonsen); wrapper kun på små skjermer */
        @media (min-width: 761px) { .banner-title { white-space: nowrap; } }
        /* Auto-add the dotted flourish so staff only type the phrase */
        .banner-title::before { content: '...'; margin-right: .18em; letter-spacing: .04em; }
        .banner-title::after  { content: '...'; margin-left: .18em; letter-spacing: .04em; }
        @media (max-width: 560px) { .banner-title::before, .banner-title::after { content: ''; margin: 0; } }

        /* Campaign banner: text left, image right */
        .campaign { display: flex; gap: 34px; align-items: stretch; }
        .campaign__text { flex: 1 1 50%; min-width: 0; display: flex; flex-direction: column; }
        .campaign__media { flex: 1 1 48%; min-width: 0; }
        .campaign__title { font-family: 'Sora', 'Poppins', sans-serif; font-weight: 400; font-size: clamp(1.4rem, 2.6vw, 2.5rem); margin-bottom: 18px; color: #fff; letter-spacing: -.01em; }
        .campaign__title strong { font-weight: 700; }
        .campaign__body { margin-bottom: 16px; }
        .campaign__body .line { font-size: 1.2rem; line-height: 1.8; color: #f0f0f0; }
        .campaign__body .bullet { font-size: 1.2rem; line-height: 1.8; color: #f0f0f0; padding-left: 1.25em; position: relative; }
        .campaign__body .bullet::before { content: '\2022'; position: absolute; left: .3em; }
        /* WYSIWYG content (bodyHtml from the admin editor) */
        .campaign__rich { font-size: 1.2rem; line-height: 1.8; color: #f0f0f0; }
        .campaign__rich p { margin: 0 0 .4em; }
        .campaign__rich h2, .campaign__rich h3 { color: #fff; margin: .2em 0 .4em; line-height: 1.25; }
        .campaign__rich ul, .campaign__rich ol { margin: 0 0 .5em; padding-left: 1.4em; }
        .campaign__rich a { color: #5AA1CC; }
        .campaign__rich img { max-width: 100%; border-radius: 10px; display: block; margin: .5em 0; }
        .campaign__rich .ql-align-center { text-align: center; }
        .campaign__rich .ql-align-right { text-align: right; }
        .campaign__fineprint { font-size: .95rem; color: #a7a9ab; margin-top: auto; padding-top: 10px; text-align: right; line-height: 1.55; }
        .campaign__cta { display: inline-block; margin-top: 26px; background: #F5B183; border: 3px solid #E8813C; color: #7A3E12; font-family: 'Sora','Poppins',sans-serif; font-weight: 700; padding: 15px 38px; border-radius: 28px; text-decoration: none; font-size: 1.05rem; transition: background .2s, transform .2s; }
        .campaign__cta:hover { background: #f2a566; transform: translateY(-2px); }
        .campaign__media { display: flex; }
        .campaign__media { aspect-ratio: 16 / 9; align-self: start; }
        .campaign__img { width: 100%; height: 100%; border-radius: 12px; object-fit: cover; display: block; }

        /* Events list */
        .events { margin-top: 36px; display: grid; gap: 18px; }
        .events__heading { font-family: 'Sora','Poppins',sans-serif; font-weight: 700; font-size: 1.3rem; margin-bottom: 4px; color: #fff; }
        .event-card { display: flex; gap: 22px; align-items: center; background: rgba(255,255,255,.05); border-radius: 14px; padding: 18px; }
        .event-card__img { width: 190px; height: 120px; object-fit: cover; border-radius: 10px; flex: none; }
        .event-card__date { color: #FFA500; font-weight: 600; font-size: .9rem; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
        .event-card__title { font-family: 'Sora','Poppins',sans-serif; font-weight: 700; font-size: 1.25rem; margin-bottom: 6px; }
        .event-card__body .line { font-size: .98rem; line-height: 1.6; color: #e7e7e7; }
        .event-card__cta { display: inline-block; margin-top: 10px; background: #5AA1CC; color: #10202a; font-weight: 700; padding: 9px 22px; border-radius: 22px; text-decoration: none; font-size: .9rem; }

        @media (max-width: 760px) {
            /* Compact stack — the whole campaign must fit a short Wix mobile
               iframe (budget ≤700px at 390px width; guarded by e2e). */
            body { padding: 6px; }
            .banner-title { font-size: 1.8rem; margin: 0 0 14px; }
            .campaign { flex-direction: column; align-items: stretch; gap: 14px; }
            .campaign__media { order: -1; width: 100%; }
            .campaign__img { height: 190px; }
            .campaign__title { font-size: 1.45rem; margin-bottom: 10px; }
            .campaign__body { margin-bottom: 10px; }
            .campaign__body .line, .campaign__body .bullet { font-size: 1rem; line-height: 1.55; }
            .campaign__fineprint { font-size: .85rem; padding-top: 6px; }
            .campaign__cta { margin-top: 12px; padding: 12px 30px; font-size: 1rem; }
            .event-card { flex-direction: column; text-align: center; }
            .event-card__img { width: 100%; height: 190px; }
        }
    </style>
</head>
<body>
    <div id="sections"></div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCy7ChtwdvREnzEvm-FG0XcnB_FwpZOdf8",
            authDomain: "sportsenter1-5f83f.firebaseapp.com",
            projectId: "sportsenter1-5f83f",
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const root = document.getElementById('sections');

        // Small helper: append body text split on newlines into .line rows (safe via textContent).
        function appendLines(parent, text, lineClass) {
            (text || '').split('\n').forEach(raw => {
                const t = raw.trim();
                if (!t) return;
                const line = document.createElement('div');
                // Lines starting with '- ' render as real bullets (like the ad)
                if (t.startsWith('- ')) {
                    line.className = 'bullet';
                    line.textContent = t.slice(2);
                } else {
                    line.className = lineClass;
                    line.textContent = t;
                }
                parent.appendChild(line);
            });
        }

        function renderCampaign(c) {
            const wrap = document.createElement('div');
            wrap.className = 'campaign';

            const text = document.createElement('div');
            text.className = 'campaign__text';
            if (!c.bodyHtml) {
                const title = document.createElement('h2');
                title.className = 'campaign__title';
                // Like the ad: the part BEFORE the dash is bold, the rest regular.
                const tRaw = c.title || '';
                const dashIdx = tRaw.search(/\s[–-]\s/);
                if (dashIdx > 0) {
                    const strong = document.createElement('strong');
                    strong.textContent = tRaw.slice(0, dashIdx);
                    title.appendChild(strong);
                    title.appendChild(document.createTextNode(tRaw.slice(dashIdx)));
                } else {
                    const strong = document.createElement('strong');
                    strong.textContent = tRaw;
                    title.appendChild(strong);
                }
                text.appendChild(title);
            }
            const body = document.createElement('div');
            body.className = 'campaign__body';
            if (c.bodyHtml) {
                // Rich content from the admin WYSIWYG editor (Chris' free formats).
                const rich = document.createElement('div');
                rich.className = 'campaign__rich';
                rich.innerHTML = (window.DOMPurify ? DOMPurify.sanitize(c.bodyHtml) : c.bodyHtml);
                // First H1 = the section banner (rendered separately from the
                // derived bannerTitle field) — don't repeat it in the column.
                const h1 = rich.querySelector('h1');
                if (h1) h1.remove();
                body.appendChild(rich);
            } else {
                appendLines(body, c.body, 'line');
            }
            text.appendChild(body);
            if (c.finePrint) {
                const fp = document.createElement('div');
                fp.className = 'campaign__fineprint';
                fp.textContent = c.finePrint;
                text.appendChild(fp);
            }
            wrap.appendChild(text);

            if (c.imageUrl) {
                const media = document.createElement('div');
                media.className = 'campaign__media';
                const img = document.createElement('img');
                img.className = 'campaign__img';
                img.src = c.imageUrl;
                img.alt = c.title || 'Kampanje';
                media.appendChild(img);
                wrap.appendChild(media);
            }
            // CTA sits BELOW the text/image row, bottom-left — like the ad.
            if (c.ctaText && c.ctaLink) {
                const outer = document.createElement('div');
                outer.appendChild(wrap);
                const cta = document.createElement('a');
                cta.className = 'campaign__cta';
                cta.href = c.ctaLink;
                cta.textContent = c.ctaText;
                outer.appendChild(cta);
                return outer;
            }
            return wrap;
        }

        function renderEvent(e) {
            const card = document.createElement('div');
            card.className = 'event-card';
            if (e.imageUrl) {
                const img = document.createElement('img');
                img.className = 'event-card__img';
                img.src = e.imageUrl;
                img.alt = e.title || 'Event';
                card.appendChild(img);
            }
            const info = document.createElement('div');
            info.className = 'event-card__info';
            if (e.dateText) {
                const d = document.createElement('div');
                d.className = 'event-card__date';
                d.textContent = e.dateText;
                info.appendChild(d);
            }
            const title = document.createElement('div');
            title.className = 'event-card__title';
            title.textContent = e.title || '';
            info.appendChild(title);
            const body = document.createElement('div');
            body.className = 'event-card__body';
            if (e.bodyHtml) {
                const rich = document.createElement('div');
                rich.className = 'campaign__rich';
                rich.style.fontSize = '.98rem';
                rich.innerHTML = (window.DOMPurify ? DOMPurify.sanitize(e.bodyHtml) : e.bodyHtml);
                body.appendChild(rich);
            } else {
                appendLines(body, e.body, 'line');
            }
            info.appendChild(body);
            if (e.ctaText && e.ctaLink) {
                const cta = document.createElement('a');
                cta.className = 'event-card__cta';
                cta.href = e.ctaLink;
                cta.textContent = e.ctaText;
                info.appendChild(cta);
            }
            card.appendChild(info);
            return card;
        }

        db.collection('websiteSections').get()
          .then(snap => {
              const docs = snap.docs.map(d => d.data()).filter(d => d.active === true);
              const byOrder = (a, b) => (a.order ?? 999) - (b.order ?? 999);
              const campaigns = docs.filter(d => d.type === 'campaign').sort(byOrder);
              const events = docs.filter(d => d.type === 'event').sort(byOrder);

              // Staff-editable section heading (from the top campaign, else top event).
              const bannerTitle = (campaigns[0] && campaigns[0].bannerTitle) || (events[0] && events[0].bannerTitle) || '';
              if (bannerTitle) {
                  const h = document.createElement('div');
                  h.className = 'banner-title';
                  h.textContent = bannerTitle;
                  root.appendChild(h);
              }

              // Top (lowest-order) active campaign becomes the banner.
              if (campaigns[0]) root.appendChild(renderCampaign(campaigns[0]));

              // All active events, listed below.
              if (events.length) {
                  const wrap = document.createElement('div');
                  wrap.className = 'events';
                  events.forEach(e => wrap.appendChild(renderEvent(e)));
                  root.appendChild(wrap);
              }
              // If nothing active, render nothing (section collapses).
          })
          .catch(err => { console.error('Feil ved lasting av seksjoner:', err); /* render nothing on error */ });
    
        // Auto-height for host pages that listen (the Astro site does; the
        // Wix embed keeps its fixed frame and ignores these messages).
        function postHeight() {
            // Measure the CONTENT, not the document — body has min-height:100vh
            // + centering, so documentElement.scrollHeight tracks the iframe
            // size and feeds back into the parent's resize (grew to the cap).
            try {
                const el = document.getElementById('sections');
                const h = el ? Math.ceil(el.getBoundingClientRect().height) + 40 : 0;
                if (h > 60) parent.postMessage({ sp1Embed: 'kampanje', height: h }, '*');
            } catch (e) {}
        }
        window.addEventListener('load', () => { postHeight(); setTimeout(postHeight, 800); setTimeout(postHeight, 2500); });
        new MutationObserver(() => postHeight()).observe(document.body, { childList: true, subtree: true });
        window.addEventListener('resize', postHeight);
    </script>
</body>
</html>
