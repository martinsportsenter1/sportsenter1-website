<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gruppetimer – alle avdelinger</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #121212;
            color: #EEEEEE;
            font-family: Helvetica, Arial, sans-serif;
            padding: 20px 0;
        }
        #classes-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        .month-heading {
            font-size: 2.5rem;
            margin: 40px 0 20px;
            color: #EEEEEE;
            text-align: center;
            font-weight: 700;
        }
        .class-card {
            background-color: #212121;
            color: white;
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            overflow: hidden;
        }
        .left-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            gap: 5px;
            z-index: 2;
            font-weight: 500;
            flex: 1;
        }
        .center-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.9rem;
            font-weight: bold;
            text-align: center;
            z-index: 1;
            pointer-events: none;
            white-space: nowrap;
        }
        .yoga-class {
            font-size: 2.2rem !important;
        }
        .right-container {
            font-size: 1rem;
            color: #F5F5F5;
            z-index: 2;
            font-weight: 500;
            text-align: right;
            flex: 1;
        }
        .date-text { font-size: 1rem; }
        .time-text { font-size: 1rem; color: #F5F5F5; }
        .location-text { font-size: 1rem; font-weight: 700; letter-spacing: .03em; }
        /* Mobile Responsive Styles */
        @media (max-width: 768px) {
            .month-heading { font-size: 2rem; margin: 30px 0 15px; }
            .class-card { flex-direction: column; text-align: center; padding: 15px; }
            .left-container, .right-container { align-items: center !important; text-align: center; margin-bottom: 10px; }
            .center-container { position: relative; top: unset; left: unset; transform: none; margin: 10px 0; font-size: 1.7rem; order: -1; }
            .yoga-class { font-size: 1.9rem !important; }
            .date-text, .time-text, .location-text { font-size: 0.9rem; }
            .right-container { text-align: center; font-size: 0.9rem; }
        }
        @media (max-width: 480px) {
            .month-heading { font-size: 1.8rem; }
            .center-container { font-size: 1.5rem; white-space: normal; }
            .yoga-class { font-size: 1.6rem !important; }
            #classes-container { padding: 10px; }
        }
    </style>
</head>
<body>
    <div id="classes-container"></div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script>
        // ─── This page shows BOTH avdelinger. Each source tags its own location. ───
        const SOURCES = [
            { collection: "vinterbro_class_schedule", location: "VINTERBRO" },
            { collection: "kolbotn_class_schedule",   location: "KOLBOTN"  },
        ];
        // ────────────────────────────────────────────────────────────────────────────

        const firebaseConfig = {
            apiKey: "AIzaSyCy7ChtwdvREnzEvm-FG0XcnB_FwpZOdf8",
            authDomain: "sportsenter1-5f83f.firebaseapp.com",
            projectId: "sportsenter1-5f83f",
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const container = document.getElementById('classes-container');

        // Dates are stored at Oslo local-midnight; read every calendar value in Europe/Oslo so it's correct for any visitor.
        const TZ = 'Europe/Oslo';
        function osloYMD(dateStr) {
            return new Date(dateStr).toLocaleDateString('en-CA', { timeZone: TZ });
        }
        function formatFullNorwegianDate(dateStr) {
            const d = new Date(dateStr);
            const dayName = d.toLocaleDateString('no-NO', { timeZone: TZ, weekday: 'long' });
            const dayNum = d.toLocaleDateString('en-US', { timeZone: TZ, day: 'numeric' }) + '.';
            const monthName = d.toLocaleDateString('no-NO', { timeZone: TZ, month: 'long' });
            return `${dayName} ${dayNum} ${monthName}`;
        }
        function formatMonthYear(dateStr) {
            return new Date(dateStr).toLocaleString('no-NO', { timeZone: TZ, month: 'long', year: 'numeric' });
        }
        function capitalizeFirstLetter(str) {
            return str.charAt(0).toUpperCase() + str.slice(1);
        }
        function tailwindBgToBrightPastel(bgClass) {
            const pastelMap = {
                "bg-green-500": "#A8F0C6", "bg-blue-500": "#A8D7F0", "bg-red-500": "#F0A8A8",
                "bg-yellow-500": "#FFF7AA", "bg-purple-500": "#D6A8F0", "bg-pink-500": "#F0A8D7",
                "bg-indigo-500": "#B8B8F0", "bg-orange-500": "#FFD1A8",
            };
            return pastelMap[bgClass] || "#E0E0E0";
        }

        const todayKey = new Date().toLocaleDateString('en-CA', { timeZone: TZ });

        // Fetch every source in parallel, tag each doc with its default location, then merge.
        Promise.all(SOURCES.map(src =>
            db.collection(src.collection).orderBy("date").get()
              .then(snap => snap.docs.map(doc => ({ ...doc.data(), location: doc.data().location || src.location })))
              .catch(() => [])   // one empty/failed collection must not break the whole page
        ))
        .then(lists => {
            const all = lists.flat();
            if (all.length === 0) { container.innerText = "Ingen timer funnet."; return; }

            const grouped = {};
            all.forEach(data => {
                const dayKey = osloYMD(data.date);
                if (dayKey < todayKey) return; // skip past
                const monthYear = formatMonthYear(data.date);
                if (!grouped[monthYear]) grouped[monthYear] = {};
                if (!grouped[monthYear][dayKey]) grouped[monthYear][dayKey] = [];
                grouped[monthYear][dayKey].push(data);
            });

            if (Object.keys(grouped).length === 0) { container.innerText = "Ingen kommende timer."; return; }

            // Month keys in chronological order.
            const monthKeys = Object.keys(grouped).sort((a, b) => {
                const da = grouped[a][Object.keys(grouped[a])[0]][0].date;
                const dbb = grouped[b][Object.keys(grouped[b])[0]][0].date;
                return new Date(da) - new Date(dbb);
            });

            for (const monthYear of monthKeys) {
                const monthHeading = document.createElement('h2');
                monthHeading.innerText = capitalizeFirstLetter(monthYear);
                monthHeading.className = 'month-heading';
                container.appendChild(monthHeading);

                for (const dayKey of Object.keys(grouped[monthYear]).sort()) {
                    grouped[monthYear][dayKey].sort((a, b) => {
                        const aTime = a.start.split(':').map(Number);
                        const bTime = b.start.split(':').map(Number);
                        return aTime[0] - bTime[0] || aTime[1] - bTime[1];
                    });

                    grouped[monthYear][dayKey].forEach(data => {
                        const card = document.createElement('div');
                        card.className = 'class-card';
                        const firstColorClass = (data.color || '').split(' ')[0];
                        const pastelColor = tailwindBgToBrightPastel(firstColorClass);

                        const leftContainer = document.createElement('div');
                        leftContainer.className = 'left-container';
                        leftContainer.style.color = pastelColor;
                        const date = document.createElement('div');
                        date.innerText = formatFullNorwegianDate(data.date);
                        date.className = 'date-text';
                        const time = document.createElement('div');
                        time.innerText = `${data.start} - ${data.end}`;
                        time.className = 'time-text';
                        const location = document.createElement('div');
                        location.innerText = data.location;
                        location.className = 'location-text';
                        leftContainer.appendChild(date);
                        leftContainer.appendChild(time);
                        leftContainer.appendChild(location);

                        const centerContainer = document.createElement('div');
                        centerContainer.innerText = data.className;
                        centerContainer.className = 'center-container';
                        if (/yoga/i.test(data.className)) centerContainer.classList.add('yoga-class');
                        centerContainer.style.color = pastelColor;

                        const rightContainer = document.createElement('div');
                        rightContainer.innerText = `Med ${data.instructor}`;
                        rightContainer.className = 'right-container';

                        card.appendChild(leftContainer);
                        card.appendChild(centerContainer);
                        card.appendChild(rightContainer);
                        container.appendChild(card);
                    });
                }
            }
        })
        .catch(err => {
            console.error("Feil ved henting av timer:", err);
            container.innerText = "Feil ved lasting av timer.";
        });
    </script>
</body>
</html>
